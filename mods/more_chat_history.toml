id = "more_chat_history"
kind = "native-mod"
name = "More Chat History"
summary = "Raises the chat history from vanilla's 100 messages to 16384."
description = """
Keeps up to 16384 chat messages instead of vanilla's 100, so you can scroll back through a long session.

- Chat messages, wrapped lines and the up-arrow history of sent messages all keep 16384 entries.
- Nothing else about the chat changes: scrolling, search and resizing work as before.

Made for Horizon from the idea of [More Chat History](https://modrinth.com/mod/morechathistory) by JackFredMods (CC0-1.0).
None of its code is used. This is a native mod: three mixins replace the chat's trimming functions with copies that
use the new limit.

**Draft:** it needs `#[replaceable]` on three chat functions, merged in horizon-rust/horizon#18356 (commit
`39f1a51b3c`). No Nightly or Mod SDK contains it yet, so version 0.1.0 is not built or played; it will be rebuilt and
replaced once a Nightly has it.
"""
